<!doctype html> <!-- Declara el tipo de documento como HTML5 -->
<html lang="en"> <!-- Elemento raíz de la página, especificando que el idioma principal es inglés -->
  <head> <!-- Contiene metadatos, enlaces a recursos externos y el título de la página -->
    <meta charset="UTF-8" /> <!-- Define la codificación de caracteres como UTF-8 para soportar tildes y caracteres especiales -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- Define el ícono (favicon) que aparece en la pestaña del navegador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Configura el diseño adaptable (responsive) para dispositivos móviles -->
    <title>mi-app</title> <!-- Define el texto que se muestra en la pestaña del navegador -->
  </head> <!-- Cierre de la sección de metadatos y configuración -->
  <body> <!-- Contiene los elementos visibles de la interfaz de usuario -->
    <div id="root"></div> <!-- Contenedor principal (punto de montaje) donde React inyectará toda la aplicación -->
    <script type="module" src="/src/main.jsx"></script> <!-- Carga el archivo de entrada principal de la aplicación en React como un módulo de JavaScript -->
  </body> <!-- Cierre del cuerpo del documento -->
</html> <!-- Cierre del elemento raíz HTML -->
